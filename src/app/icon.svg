<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Favicon Stardust. Dessiné plutôt que trouvé : un SVG reste net à toutes les
    tailles, ne dépend d'aucune ressource externe, et suit la charte du site.
    Fond opaque : sur un onglet clair, un éclat clair sans fond disparaîtrait.
  -->
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fa6ff" />
      <stop offset="1" stop-color="#a06cff" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0b0d12" />
  <!-- éclat principal : quatre pointes concaves, la forme lue comme « scintillement » -->
  <path
    fill="url(#s)"
    d="M16 4.5c.85 6.9 4.6 10.65 11.5 11.5-6.9.85-10.65 4.6-11.5 11.5-.85-6.9-4.6-10.65-11.5-11.5 6.9-.85 10.65-4.6 11.5-11.5Z"
  />
  <!-- deux éclats secondaires : la poussière, ce n'est pas une étoile seule -->
  <path fill="#e8b34a" d="M25.5 5.5c.3 2.1 1.4 3.2 3.5 3.5-2.1.3-3.2 1.4-3.5 3.5-.3-2.1-1.4-3.2-3.5-3.5 2.1-.3 3.2-1.4 3.5-3.5Z" />
  <path fill="#6c8cff" d="M7 20.5c.22 1.5 1 2.28 2.5 2.5-1.5.22-2.28 1-2.5 2.5-.22-1.5-1-2.28-2.5-2.5 1.5-.22 2.28-1 2.5-2.5Z" />
</svg>
